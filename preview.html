<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTEXA | 3D Terminal Host Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a12;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0d1322;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-family: monospace;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #34d399);
      color: #070a12;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #131b2e;
      color: #94a3b8;
      border: 1px solid #1e293b;
    }
    .btn-secondary:hover {
      color: #f1f5f9;
      border-color: #38bdf8;
      background: #16223b;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 65px);
      border: none;
      background: #070a12;
    }
    .fallback-box {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #070a12;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18" />
          <path d="m19 9-5 5-4-4-3 3" />
        </svg>
      </div>
      <div>
        <h1>QUANTEXA 3D Terminal</h1>
      </div>
      <span class="status-pill">
        <span class="pulse-dot"></span> HOST ACTIVE (PORT 5188)
      </span>
    </div>

    <div class="actions">
      <a href="http://localhost:5188/" target="_blank" class="btn btn-primary">
        <span>Open In New Tab</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      </a>
      <a href="http://192.168.20.25:5188/" target="_blank" class="btn btn-secondary">
        LAN: 192.168.20.25:5188
      </a>
      <a href="http://127.0.0.1:8000/docs" target="_blank" class="btn btn-secondary">
        FastAPI Docs (:8000)
      </a>
    </div>
  </header>

  <main>
    <iframe id="appFrame" src="http://localhost:5188/"></iframe>
  </main>
</body>
</html>
